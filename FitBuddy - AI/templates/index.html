<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #1f6feb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
        }

        .header p {
            margin-top: 8px;
            font-size: 17px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1f6feb;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1557b0;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #eef5ff;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>FitBuddy AI</h1>
        <p>AI Fitness Plan Generator</p>
    </div>

    <div class="container">

        <h2>Create Your Fitness Plan</h2>

        <form action="/generate-workout" method="post">

            <label for="user_id">User ID</label>
            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="Enter your User ID"
                required
            >

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="13"
                max="100"
                placeholder="Enter your age"
                required
            >

            <label for="weight">Weight (kg)</label>
            <input
                type="number"
                id="weight"
                name="weight"
                step="0.1"
                min="1"
                placeholder="Enter your weight"
                required
            >

            <label for="goal">Fitness Goal</label>
            <select id="goal" name="goal" required>
                <option value="">Select your goal</option>
                <option value="weight loss">Weight Loss</option>
                <option value="muscle gain">Muscle Gain</option>
                <option value="general wellness">General Wellness</option>
                <option value="flexibility">Flexibility</option>
            </select>

            <label for="intensity">Workout Intensity</label>
            <select id="intensity" name="intensity" required>
                <option value="">Select intensity</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <button type="submit">
                Generate My Workout Plan
            </button>

        </form>

        <div class="info">
            <strong>How FitBuddy works:</strong>
            <p>
                Enter your details and fitness goal.
                FitBuddy will generate a personalized 7-day
                workout plan and nutrition tip.
            </p>
        </div>

    </div>

</body>
</html>
